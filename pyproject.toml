[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boltwork-mcp"
version = "0.1.5"
description = "MCP server for Boltwork - AI services via Bitcoin Lightning"
readme = {file = "README.md", content-type = "text/markdown"}
license = { text = "MIT" }
authors = [
    { name = "Cracked Minds", email = "hello@crackedminds.co.uk" }
]
keywords = ["mcp", "model-context-protocol", "lightning", "bitcoin", "l402", "ai", "agents"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
nwc = [
    "pynostr>=0.6.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/Squidboy30/boltwork-mcp"
Repository = "https://github.com/Squidboy30/boltwork-mcp"

[project.scripts]
boltwork-mcp = "boltwork_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/boltwork_mcp"]
